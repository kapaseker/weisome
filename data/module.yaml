product:
  type: kmp/lib
  platforms: [jvm]

dependencies:
  - ../contracts
  - androidx.datastore:datastore:1.2.1
  - androidx.datastore:datastore-core-okio:1.2.1
  - androidx.datastore:datastore-preferences:1.2.1
  - androidx.room3:room3-runtime:3.0.3
  - androidx.sqlite:sqlite-bundled:2.7.1
  - dev.snipme:highlights:1.1.0
  - io.insert-koin:koin-core:4.2.2

settings:
  kotlin:
    ksp:
      processors:
        - androidx.room3:room3-compiler:3.0.3
      processorOptions:
        room.schemaLocation: ./schema
