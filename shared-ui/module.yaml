product:
  type: kmp/lib
  platforms: [jvm]

dependencies:
  - ../contracts
  - $compose.foundation: exported
  - org.jetbrains.compose.material:material-ripple:1.12.0
  - $compose.components.resources
  - org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0
  - org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3:2.11.0
  - org.jetbrains.androidx.navigation3:navigation3-ui:1.1.1
  # navigation3-ui 1.1.1 pins navigationevent-compose 1.0.1, whose lookup recurses
  # infinitely with Compose 1.12 (StackOverflowError); 1.1.0 is what Compose 1.12 expects.
  - org.jetbrains.androidx.navigationevent:navigationevent-compose:1.1.0
  - io.insert-koin:koin-core:4.2.2
  - io.insert-koin:koin-compose:4.2.2
  - io.insert-koin:koin-core-viewmodel:4.2.2
  - io.insert-koin:koin-compose-viewmodel:4.2.2

dependencies@jvm:
  - $compose.desktop.currentOs
  - org.jetbrains.kotlinx:kotlinx-coroutines-swing:1.11.0

settings:
  compose:
    enabled: true
    resources:
      exposedAccessors: true
      packageName: com.rocybyte.weisome.generated.resources
  kotlin:
    serialization: json
